<app-header class="w-full"></app-header>

<div class="flex flex-col min-h-screen bg-background text-light">

   <div class="">
     <section class="w-full bg-primary2 py-10 text-center">
      <h1 class="text-3xl font-bold">Admin Dashboard</h1>
      <p class="text-lg mt-2">Manage Jobs, Users, and Applications</p>
    </section>

   <div class="container mx-auto px-4 py-8 flex-grow">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-primary p-6 rounded-lg shadow-lg text-center">
          <h2 class="text-2xl font-bold">50</h2>
          <p class="text-sm">Total Users</p>
        </div>
        <div class="bg-primary p-6 rounded-lg shadow-lg text-center">
          <h2 class="text-2xl font-bold">25</h2>
          <p class="text-sm">Active Jobs</p>
        </div>
        <div class="bg-primary p-6 rounded-lg shadow-lg text-center">
          <h2 class="text-2xl font-bold">120</h2>
          <p class="text-sm">Total Applications</p>
        </div>
      </div>

      <section class="mt-10">
        <h2 class="text-2xl font-bold mb-4 text-primary">Posted Jobs</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div *ngFor="let job of jobs" class="bg-slate-700 p-6 rounded-lg shadow-lg">
            <h3 class="text-xl font-bold text-accent">{{ job.jobTitle }}</h3>
            <p class="text-sm mt-2">{{ job.jobDescription }}</p>
            <p class="text-sm text-gray-300 mt-2"><strong>Location:</strong> {{ job.location }}</p>
            <p class="text-sm text-gray-300"><strong>Salary:</strong> {{ job.salaryRange }}</p>
            <p class="text-xs text-gray-400 mt-2">Posted on: {{ job.createdAt | date:'medium' }}</p>
          </div>
        </div>
      </section>
    </div>
  </div>
  
</div>
<app-footer class="w-full"></app-footer>
