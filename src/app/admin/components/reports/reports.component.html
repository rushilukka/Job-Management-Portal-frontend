<app-header class="w-full"></app-header>

<div class="min-h-screen flex flex-col items-center justify-center bg-background p-6 space-y-6">

  <!-- Bar & Line Chart -->
  <div class="w-full max-w-4xl bg-white shadow-lg rounded-2xl p-6">
    <h2 class="text-xl font-semibold text-center text-gray-800 mb-4">
      Job Posting & Application Trends
    </h2>
    <div class="w-full">
      <p-chart type="bar" [data]="chartData" [options]="chartOptions" class="w-full"></p-chart>
    </div>
  </div>

  <!-- Pie Chart for Job Application Status -->
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6">
    <h2 class="text-xl font-semibold text-center text-gray-800 mb-4">
      Job Application Status Distribution
    </h2>

    <!-- Status Selection -->
    <div class="flex justify-center space-x-4 mb-4">
      <label *ngFor="let status of ['Pending', 'Approved', 'Rejected']" class="flex items-center space-x-2">
        <input type="checkbox" [checked]="selectedStatuses.includes(status)" (change)="toggleStatus(status)">
        <span class="text-gray-700">{{ status }}</span>
      </label>
    </div>

    <div class="w-full flex justify-center">
      <p-chart type="pie" [data]="pieChartData" [options]="pieChartOptions" class="w-full"></p-chart>
    </div>
  </div>

</div>

<app-footer></app-footer>
