<app-header class="w-full"></app-header>

<div class="container min-h-screen mx-auto p-6">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-primary">Manage Users</h2>
    </div>

    <!-- Users Table -->
    <div class="overflow-x-auto">
        <table class="w-full border-collapse border border-gray-300 bg-white">
            <thead>
                <tr class="bg-primary text-white">
                    <th class="border border-gray-300 p-3 text-left">Name</th>
                    <th class="border border-gray-300 p-3 text-left">Email</th>
                    <th class="border border-gray-300 p-3 text-left">Phone Number</th>
                    <th class="border border-gray-300 p-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users" class="hover:bg-gray-100">
                    <td class="border border-gray-300 p-3">{{ user.name }}</td>
                    <td class="border border-gray-300 p-3">{{ user.email }}</td>
                    <td class="border border-gray-300 p-3">{{ user.phoneNumber }}</td>
                    <td class="border border-gray-300 p-3 text-center flex justify-center space-x-3">
                        <button 
                            (click)="viewUserDetails(user)" 
                            class="bg-secondary text-white px-3 py-1 rounded-md hover:bg-gray-700 transition-all">
                            View Details
                        </button>
                       
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<app-footer></app-footer>
