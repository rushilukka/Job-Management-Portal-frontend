<app-header class="w-full"></app-header>

<div class="min-h-screen flex justify-center items-center bg-background p-6">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl bg-slate-900 p-6 rounded-2xl shadow-lg">
    
    <!-- Admin Details -->
    <div class=" p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold text-white mb-4">Admin Profile</h2>
      <p class="text-gray-300"><span class="font-medium text-yellow-400">Name:</span> {{name}}</p>
      <p class="text-gray-300"><span class="font-medium text-yellow-400">Email:</span> {{email}}</p>
    </div>

    <!-- Actions -->
    <div class="bg-slate-700 p-6 rounded-xl shadow-md flex flex-col gap-4">
      <h2 class="text-xl font-semibold text-white mb-4">Security Settings</h2>
      
      <button class="w-full bg-purple-700 hover:bg-purple-600 text-white py-2 rounded-lg">
        Reset Password
      </button>

      <button *ngIf="!is2FAEnabled" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black py-2 rounded-lg">
        Enable 2FA
      </button>
      
      <p *ngIf="is2FAEnabled" class="text-green-400 text-sm">2FA is already enabled</p>
    </div>

  </div>
</div>

<app-footer></app-footer>
