<header class="bg-primary text-light shadow-lg">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <!-- Logo -->
    <a routerLink="/users/dashboard" class="text-xl font-bold flex items-center gap-2">
      <i class="fa fa-briefcase text-yellow-400"></i>
      FoundIt.in - Job Portal
    </a>

    <!-- Navigation -->
    <nav class="flex items-center space-x-6">
     

      <!-- User Profile & Logout -->
      <div class="flex items-center space-x-4">
        <!-- User Profile Dropdown -->
        <div class="relative group">
          <button class="flex items-center space-x-2 hover:text-accent">
            <i class="fa fa-user text-xl"></i>
            <span class="hidden md:inline">Profile</span>
          </button>

          <!-- Dropdown Menu -->
          <div 
            class="absolute right-0 mt-2 w-40 bg-white text-black rounded-lg shadow-lg p-2 opacity-0 group-hover:opacity-100 transition-all">
            <a routerLink="/users/profile" class="block px-4 py-2 hover:bg-gray-200">
              <i class="fa fa-user-circle"></i> My Profile
            </a>
            <a routerLink="/users/settings" class="block px-4 py-2 hover:bg-gray-200">
              <i class="fa fa-cog"></i> Settings
            </a>  

            <button 
            (click)="logout()" 
            class="l-0  py-2 hover:bg-gray-200  w-full">
            <i class="fa fa-sign-out"></i> Logout
          </button>
          </div>
        </div>

        <!-- Logout Button -->
        <!-- <button 
          (click)="logout()" 
          class="bg-accent text-purple-800 px-4 py-2 rounded-lg hover:bg-yellow-300 transition-all flex items-center gap-2">
          <i class="fa fa-sign-out"></i> Logout
        </button> -->
      </div>
    </nav>
  </div>
</header>
