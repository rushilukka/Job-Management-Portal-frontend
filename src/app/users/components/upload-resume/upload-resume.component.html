<div class="container mx-auto p-6">
    <h2 class="text-2xl font-bold text-primary mb-4">Upload Resume</h2>
  
    <input type="file" (change)="onFileSelected($event)" class="block w-full border p-2 mb-4">
    
    <button 
      (click)="uploadResume()" 
      class="bg-accent text-purple-800 px-4 py-2 rounded-lg hover:bg-yellow-300 transition-all">
      Upload
    </button>
  </div>
