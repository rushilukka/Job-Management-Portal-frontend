<div class="flex min-h-screen items-center justify-center bg-background p-6">
  <div class="w-full max-w-md rounded-lg glass-dark p-8 shadow-lg">
    <h2 class="mb-4 text-center text-2xl font-bold text-primary">Email Verification Pending</h2>
    <p class="mb-4 text-center text-gray-600">Check your email for a verification link.</p>

    <button
      (click)="resendVerification()"
      class="w-full rounded-lg bg-primary p-3 text-light hover:bg-purple-800"
    >
      Resend Email
    </button>
  </div>
</div>
