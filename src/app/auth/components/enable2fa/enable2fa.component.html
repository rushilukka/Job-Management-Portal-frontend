<div class="flex min-h-screen items-center justify-center bg-background p-6">
  <div
    class="w-full max-w-md rounded-lg glass-dark p-8 shadow-lg"
    *ngIf="qrCodeUrl"
  >
    <h2 class="mb-4 text-center text-2xl font-bold text-primary">Enable 2FA</h2>
    <p class="mb-4 text-center text-gray-600">Scan the QR code using your authenticator app:</p>

    <div class="flex justify-center">
      <img [src]="qrCodeUrl" *ngIf="qrCodeUrl" class="w-40 h-40 rounded-lg shadow-md" />
    </div>

    <input
      type="text"
      [(ngModel)]="totp"
      placeholder="Enter TOTP Code"
      class="mt-4 w-full rounded-lg border border-gray-300 p-3 focus:border-primary focus:ring-2 focus:ring-primary"
    />

    <button
      (click)="verify()"
      class="mt-4 w-full rounded-lg bg-primary p-3 text-light hover:bg-purple-800"
    >
      Verify & Enable
    </button>
  </div>

  <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-lg" *ngIf="!qrCodeUrl">
    <h2 class="text-center text-2xl font-bold text-primary">2FA Already Enabled</h2>
  </div>
</div>
