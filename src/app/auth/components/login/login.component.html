<div class="flex min-h-screen items-center justify-center bg-background p-6 ">
  <div class="w-full max-w-md rounded-lg   p-8 shadow-lg glass-dark">
    <h2 class="mb-4 text-center text-2xl font-bold text-primary">Login</h2>
    <form (ngSubmit)="onLogin()" class="space-y-4">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
        class="w-full rounded-lg border border-gray-300 p-3 focus:border-primary focus:ring-2 focus:ring-primary"
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
        class="w-full rounded-lg border border-gray-300 p-3 focus:border-primary focus:ring-2 focus:ring-primary"
      />

      <!--   Show TOTP input only if 2FA is required -->
      <div *ngIf="requires2FA" class="mt-2">
        <input
          type="text"
          [(ngModel)]="totp"
          name="totp"
          placeholder="Enter TOTP Code"
          required
          class="w-full rounded-lg border border-gray-300 p-3 focus:border-primary focus:ring-2 focus:ring-primary"
        />
        <button
          type="submit"
          class="mt-3 w-full rounded-lg bg-accent p-3 text-light hover:bg-yellow-500"
        >
          Verify TOTP
        </button>
      </div>

      <!--   Show login button if 2FA is NOT required -->
      <button
        type="submit"
        *ngIf="!requires2FA"
        class="w-full rounded-lg bg-primary p-3 text-light hover:bg-purple-800"
      >
        Login
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Don't have an account?
      <a routerLink="/auth/signup" class="text-secondary hover:underline">Sign up</a>
    </p>
  </div>
</div>

<!--   Show 2FA Popup If Needed -->
<div *ngIf="show2FAPopup" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
  <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow-lg">
    <p class="text-center text-lg font-medium text-gray-800">2FA Verification</p>
    <app-popup [Token]="TokenJWT" (closePopup)="closePopup()" class="mt-4"></app-popup>
  </div>
</div>
